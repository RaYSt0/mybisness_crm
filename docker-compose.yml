services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mybusiness_crm
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm_dev_password}
    ports:
      - "5433:5432"
    volumes:
      - mybusiness_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d mybusiness_crm"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mybusiness_postgres_data:
